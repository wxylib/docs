<path d="M585 222 L585 190" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="578" y="203" font-size="11" text-anchor="end" fill="#555">from_refs_table,</text>
<text x="578" y="216" font-size="11" text-anchor="end" fill="#555">write_icechunk</text>
