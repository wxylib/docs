<text x="675" y="74" font-size="11" text-anchor="middle" fill="#555">(HTTPS byte ranges)</text>
<text x="440" y="330" font-size="11" text-anchor="middle" fill="#555">GDAL is the scanner for now. No copy of the data and no format of our own: the table says where each chunk is, Icechunk stores that, zarrs decodes it.</text>
