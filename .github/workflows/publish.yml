# Render the Quarto site (this repository plus wxylib/design, checked out
# into design/) and publish it to GitHub Pages from main. Pull requests
# render too, so a broken page fails the check, and the rendered site is
# attached to the run as an artifact. The wxy command reference is
# regenerated from wxylib/core's main on every run, and a daily run keeps
# it current when only core has changed. Needs Pages turned on with "GitHub
# Actions" as the source (Settings, Pages).
name: publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/design
          path: design
      # A dot directory, so Quarto never treats it as site content
      - uses: actions/checkout@v4
        with:
          repository: wxylib/core
          path: .wxy-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .wxy-core
      - name: Command reference from wxy --help
        run: |
          cargo build --manifest-path .wxy-core/Cargo.toml -p wxy-cli
          python3 reference/gen-cli.py .wxy-core/target/debug/wxy "$(git -C .wxy-core rev-parse HEAD)"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
