# Comment on each pull request with links to its changed documents and
# figures, rendered by GitHub at the pull request's head commit, so they
# can be read as they will look after merging (relative images and links
# included). One comment per pull request, updated on each push. No build
# step: when this repository becomes a book, this is the place for a
# rendered-site preview instead.
name: doc-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork pull requests get a read-only token and cannot comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const doc = /\.(md|markdown|svg|png|jpe?g|gif)$/i;
            const shown = files.filter(f => doc.test(f.filename) && f.status !== 'removed');
            const marker = '<!-- doc-preview -->';
            const sha = pr.head.sha;
            const base = `https://github.com/${owner}/${repo}/blob/${sha}/`;
            let body = `${marker}\n### Rendered preview\n\n`;
            if (shown.length === 0) {
              body += 'No documents or figures change in this pull request.\n';
            } else {
              body += `At ${sha.slice(0, 7)}, as GitHub renders them:\n\n`;
              for (const f of shown) {
                const path = f.filename.split('/').map(encodeURIComponent).join('/');
                body += `- [${f.filename}](${base}${path}) (${f.status})\n`;
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else if (shown.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
