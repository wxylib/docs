project:
  type: website
  output-dir: _site
  # Writes capabilities/_generated.md from capabilities/capabilities.yml.
  pre-render: capabilities/build.py
  # Edit and issue links on pages from wxylib/design and wxylib/core.
  post-render: repo-links.py
  render:
    - index.qmd
    - start.qmd
    - capabilities.qmd
    - demos.qmd
    - reference.qmd
    - reference/cli.qmd
    - contribute.qmd
    - oisst-virtual.md
    - crs-input.md
    - vignettes/README.md
    - vignettes/browser/README.md
    - vignettes/curvilinear/README.md
    - vignettes/points/README.md
    - vignettes/cache/README.md
    - examples/zonal/README.md
    - examples/nonaffine/README.md
    - examples/bran/README.md
    - examples/cmems/README.md
    - examples/ghrsst/README.md
    - explainers/*.qmd
    - explainers/*.md
    # wxylib/design, checked out here by the publish workflow
    - design/README.md
    - design/docs/*.md
    - design/specs/*.md
    - design/measurements/cop30/README.md

website:
  title: "wxylib"
  description: "GDAL's modular ideas as small Rust crates, checked against GDAL."
  site-url: https://wxylib.org/docs/
  repo-url: https://github.com/wxylib/docs
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  navbar:
    left:
      - text: Start
        href: start.qmd
      - text: Capabilities
        href: capabilities.qmd
      - text: How-tos
        href: vignettes/README.md
      - text: Explainers
        href: explainers/index.qmd
      - text: Demos
        href: demos.qmd
      - text: Reference
        href: reference.qmd
      - text: Design
        href: design/README.md
      - text: Contribute
        href: contribute.qmd
    right:
      - icon: github
        href: https://github.com/wxylib
  sidebar:
    - title: "How-tos"
      contents:
        - text: "All how-tos"
          href: vignettes/README.md
        - text: "A COG in any projection, in the browser"
          href: vignettes/browser/README.md
        - text: "A curvilinear grid to a polar map"
          href: vignettes/curvilinear/README.md
        - text: "Values at points"
          href: vignettes/points/README.md
        - text: "Keep the bytes a run reads"
          href: vignettes/cache/README.md
        - text: "Zonal statistics by lazy rasterization"
          href: examples/zonal/README.md
        - text: "Polygons on grids that are not a regular lattice"
          href: examples/nonaffine/README.md
        - text: "A month of OISST as virtual Zarr"
          href: oisst-virtual.md
        - text: "A year of BRAN2023 through its byte table"
          href: examples/bran/README.md
        - text: "Four estimates of one sea (draft)"
          href: examples/cmems/README.md
        - text: "Twenty-four years of MUR SST, one set of bytes"
          href: examples/ghrsst/README.md
        - text: "Which CRS strings work where"
          href: crs-input.md
    - title: "Explainers"
      contents:
        - explainers/index.qmd
        - text: "How the warper works"
          href: explainers/warper.md
        - text: "Resampling kernels"
          href: explainers/kernels.md
        - text: "Curvilinear grids"
          href: explainers/geoloc.md
        - text: "Values at points"
