        - text: "COG tiles as Zarr chunks"
          href: explainers/cog-tiles.md
        - text: "Byte-reference tables"
          href: explainers/byte-tables.md
        - explainers/testing.qmd
    - title: "Design"
      contents:
        - text: "Design overview"
          href: design/README.md
        - section: "Numbered documents"
          contents:
